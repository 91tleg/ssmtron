name: CI

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/**'

# A new push to a branch or pull request cancels that ref's older run, so
# only the latest commit builds. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==21.1.8
      - name: Check formatting
        run: |
          git ls-files -z -- 'firmware/*.c' 'firmware/*.h' |
            xargs -0 -r clang-format --dry-run --Werror

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware/test -B firmware/build-test
      - name: Build
        run: cmake --build firmware/build-test
      - name: Test
        run: ctest --test-dir firmware/build-test --output-on-failure

  firmware-build:
    # Uses Nordic's own prebuilt toolchain image, pinned to the same NCS
    # revision AGENTS.md uses locally (/opt/nordic/ncs/v3.2.4), so this
    # exercises the identical compiler/SDK version. There is no west.yml
    # in this repo (firmware/app is a freestanding application), so the
    # workspace is initialized from the sdk-nrf manifest at that tag; the
    # resulting ncs/ checkout (zephyr, nrf, and all west modules) is
    # cached since it does not change unless NCS_VERSION below does.
    name: Firmware build (nrf52840dk)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.4
    env:
      NCS_VERSION: v3.2.4
    defaults:
      run:
        # Container jobs default to `sh`, which never sees west or the
        # rest of the toolchain PATH: the image only activates those via
        # BASH_ENV, a bash-only mechanism sh silently ignores.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-repo
      - name: Cache NCS workspace
        uses: actions/cache@v4
        with:
          path: ncs
          key: ncs-${{ env.NCS_VERSION }}
      - name: Set up west workspace
        run: |
          git config --global --add safe.directory '*'
          if [ ! -d ncs/.west ]; then
            west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" ncs
          fi
          cd ncs && west update --narrow -o=--depth=1
      - name: Build firmware
        working-directory: ncs
        run: |
          west build -b nrf52840dk/nrf52840 \
            "$GITHUB_WORKSPACE/app-repo/firmware/app" \
            -d "$GITHUB_WORKSPACE/app-repo/firmware/build" --pristine

  misra:
    # Direct source scan, no build required: every file here is plain
    # C99 with zero Zephyr dependency except firmware/hal/nrf52/*.c and
    # firmware/app/fw_info.c (both excluded below), which need real
    # devicetree/Kconfig headers from an actual west build to
    # type-check correctly. Run tools/check-misra.sh against a real
    # firmware/build/compile_commands.json (see AGENTS.md) for those.
    name: MISRA
    runs-on: ubuntu-latest
    env:
      # Which rules fire changes from one cppcheck release to the next, so
      # the check runs on one release built from source rather than
      # whatever apt ships. Run the same release locally to reproduce a
      # finding, and change the version and hash together.
      CPPCHECK_VERSION: "2.20.0"
      CPPCHECK_SHA256: "7be7992439339017edb551d8e7d2315f9bb57c402da50c2cee9cd0e2724600a1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore cppcheck
        id: cppcheck
        uses: actions/cache@v4
        with:
          path: ~/cppcheck-${{ env.CPPCHECK_VERSION }}
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-${{ runner.os }}
      - name: Build cppcheck
        if: steps.cppcheck.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o cppcheck.tar.gz \
            "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
          echo "${CPPCHECK_SHA256}  cppcheck.tar.gz" | sha256sum -c -
          tar xzf cppcheck.tar.gz
          cmake -S "cppcheck-${CPPCHECK_VERSION}" -B cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/cppcheck-${CPPCHECK_VERSION}" \
            -DBUILD_TESTS=OFF \
            -DBUILD_GUI=OFF
          cmake --build cppcheck-build -j "$(nproc)"
          cmake --install cppcheck-build
      - name: MISRA check
        run: |
          root="$HOME/cppcheck-${CPPCHECK_VERSION}"
          # Fail loudly if the cache or the build is not the pinned release.
          "$root/bin/cppcheck" --version | grep -qx "Cppcheck ${CPPCHECK_VERSION}"
          "$root/bin/cppcheck" \
            --enable=all \
            --addon="$root/share/Cppcheck/addons/misra.py" \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --check-level=exhaustive \
            -I firmware \
            -I firmware/hal \
            -I firmware/lib/ecu \
            -I firmware/lib/ssm1 \
            -I firmware/lib/fmt \
            -I firmware/lib/ui \
            -I firmware/lib/display \
            -I firmware/app \
            -I firmware/bsp/nrf52840dk \
            -i firmware/app/fw_info.c \
            firmware/lib/ssm1 firmware/lib/fmt firmware/lib/textfit firmware/lib/ui \
            firmware/lib/display firmware/app
