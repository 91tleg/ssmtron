# Build the HIL rig's firmware image with this overlay added:
#   west build -b nrf52840dk/nrf52840 firmware/app -d firmware/build --pristine \
#     -- -DEXTRA_CONF_FILE=../hil/prj_hil.conf
# Never merge this into firmware/app/prj.conf: the hang hook it enables
# must not ship in a production image.
CONFIG_APP_HIL_TEST=y
