# Dev build only: the ECU link runs on UART0, the DK's USB serial port, so a
# script on the computer can play the ECU. UART0 was the console, so the
# console moves to the Segger RTT channel.
# Build with:
#   west build -b nrf52840dk/nrf52840 firmware/app -d firmware/build-dev \
#     --pristine -- \
#     -DEXTRA_CONF_FILE=$PWD/firmware/dev/ecu_on_usb.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=$PWD/firmware/dev/ecu_on_usb.overlay
# Never merge this into firmware/app/prj.conf: a gauge built this way cannot
# talk to a car.
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_APP_DEV_ECU_ON_USB=y
CONFIG_APP_DEV_ECU_BAUD=1953
