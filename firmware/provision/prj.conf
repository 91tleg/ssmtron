# Just enough for hal_nrf52 to build (it compiles hal_gpio.c/hal_uart.c
# unconditionally alongside hal_nvm.c, see firmware/hal/nrf52/CMakeLists.txt)
# and for hal_nvm's Settings/NVS backend to actually persist. No Bluetooth,
# no bootloader: this image is flashed once and never updated over the air.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_PRINTK=y
